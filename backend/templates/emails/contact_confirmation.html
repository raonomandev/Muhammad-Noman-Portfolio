<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You for Contacting Muhammad Noman</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f5f7fb; font-family:Arial, Helvetica, sans-serif; color:#1f2937;">
    <div style="max-width:640px; margin:32px auto; background:#ffffff; border:1px solid #e5e7eb; border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(15,23,42,0.08);">
      <div style="padding:32px 32px 20px; border-bottom:1px solid #eef2f7;">
        <p style="margin:0 0 8px; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#6b7280;">Portfolio Contact</p>
        <h1 style="margin:0 0 10px; font-size:26px; color:#111827;">Thank You for Contacting Me</h1>
        <p style="margin:0; font-size:15px; line-height:1.7; color:#4b5563;">Hi {{ name }},</p>
      </div>
      <div style="padding:32px;">
        <p style="margin:0 0 16px; font-size:15px; line-height:1.8; color:#374151;">
          I have successfully received your message and will respond within 24–48 hours.
        </p>
        <div style="background:#f9fafb; border:1px solid #e5e7eb; border-radius:12px; padding:18px; margin:20px 0;">
          <p style="margin:0 0 8px; color:#374151;"><strong>Name:</strong> {{ name }}</p>
          <p style="margin:0 0 8px; color:#374151;"><strong>Email:</strong> {{ email }}</p>
          <p style="margin:0; color:#374151; white-space:pre-wrap;"><strong>Message:</strong><br />{{ message }}</p>
        </div>
        <p style="margin:0; font-size:15px; line-height:1.8; color:#4b5563;">
          I appreciate your interest and patience.
        </p>
      </div>
      <div style="padding:24px 32px 32px; background:#f9fafb; border-top:1px solid #eef2f7;">
        <p style="margin:0 0 4px; font-size:15px; color:#111827; font-weight:bold;">Muhammad Noman</p>
        <p style="margin:0 0 12px; font-size:13px; color:#6b7280;">Backend Developer</p>
        <p style="margin:0; font-size:13px; color:#6b7280;">
          <a href="https://github.com/raonomandev" style="color:#2563eb; text-decoration:none; margin-right:12px;">GitHub</a>
          <a href="https://www.linkedin.com/in/rao-noman-dev/" style="color:#2563eb; text-decoration:none;">LinkedIn</a>
        </p>
      </div>
    </div>
  </body>
</html>
